# SPDX-License-Identifier: MIT
# TARCZA fork CI: run upstream's backend suite (SQLite) on our branches. Upstream's QC workflow is kept untouched and also runs on push.
name: TARCZA CI

on:
  push:
    branches: ["dev", "feature/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  server-tests:
    name: Upstream backend tests (SQLite, py3.12)
    runs-on: ubuntu-24.04
    env:
      python_version: 3.12
      INVENTREE_DB_NAME: ./inventree.sqlite
      INVENTREE_DB_ENGINE: sqlite3
      INVENTREE_PLUGINS_ENABLED: true
      INVENTREE_CONSOLE_LOG: false
      INVENTREE_MEDIA_ROOT: /home/runner/work/InvenTree/test_inventree_media
      INVENTREE_STATIC_ROOT: /home/runner/work/InvenTree/test_inventree_static
      INVENTREE_BACKUP_DIR: /home/runner/work/InvenTree/test_inventree_backup
      INVENTREE_SITE_URL: http://localhost:8000
      INVENTREE_DEBUG: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Environment Setup
        uses: ./.github/actions/setup
        with:
          apt-dependency: gettext poppler-utils
          dev-install: true
          update: true
          static: true
      - name: Backend tests
        run: invoke dev.test --check
