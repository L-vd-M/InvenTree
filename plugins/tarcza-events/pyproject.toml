[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tarcza-events"
version = "0.1.0"
description = "TARCZA InvenTree plugin: transactional outbox plus Standard Webhooks delivery of stock.received, stock.adjusted, part.created"
license = { text = "AGPL-3.0-or-later" }
requires-python = ">=3.11"
dependencies = []

[project.entry-points."inventree_plugins"]
TarczaEvents = "tarcza_events.plugin:TarczaEventsPlugin"

[tool.setuptools]
packages = ["tarcza_events"]
